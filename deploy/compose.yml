name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a pgvector image digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - ${MEMOIA_DATA_ROOT:?Set an absolute data directory}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks: [backend]

  redis:
    image: ${REDIS_IMAGE:?Set a Redis image digest}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - ${MEMOIA_DATA_ROOT:?Set an absolute data directory}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks: [backend]

  memoia:
    image: ${MEMOIA_IMAGE:?Set an accepted Memoia manifest digest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      ACCESS_TOKEN: ${ACCESS_TOKEN:?Set ACCESS_TOKEN}
      PROJECT_ID: ${PROJECT_ID:?Set PROJECT_ID}
      MEMOBASE_LLM_API_KEY: ${MEMOBASE_LLM_API_KEY:?Set MEMOBASE_LLM_API_KEY}
      MEMOBASE_EMBEDDING_API_KEY: ${MEMOBASE_EMBEDDING_API_KEY:?Set MEMOBASE_EMBEDDING_API_KEY}
      MEMOBASE_BEST_LLM_MODEL: ${MEMOBASE_BEST_LLM_MODEL:-gpt-4o-mini}
      MEMOBASE_THINKING_LLM_MODEL: ${MEMOBASE_THINKING_LLM_MODEL:-o4-mini}
      MEMOBASE_EMBEDDING_MODEL: ${MEMOBASE_EMBEDDING_MODEL:-text-embedding-3-small}
      MEMOBASE_EMBEDDING_DIM: ${MEMOBASE_EMBEDDING_DIM:-1536}
      API_HOSTS: ${API_HOSTS:?Set API_HOSTS}
      USE_CORS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks: [backend, ingress]

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set a cloudflared image digest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks: [ingress]

networks:
  backend:
    internal: true
  ingress:
