name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}

services:
  redis:
    image: ${REDIS_IMAGE:?Set a Redis image digest}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - ${MEMOIA_DATA_ROOT:?Set an absolute data directory}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks: [backend]

  memoia: &memoia-runtime
    image: ${MEMOIA_IMAGE:?Set an accepted Memoia manifest digest}
    restart: unless-stopped
    labels:
      io.jianify.environment: ${JIANIFY_ENV:?Set JIANIFY_ENV}
    environment: &memoia-environment
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-32}
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-2}
      ACCESS_TOKEN: ${ACCESS_TOKEN:?Set ACCESS_TOKEN}
      PROJECT_ID: ${PROJECT_ID:?Set PROJECT_ID}
      MEMOBASE_LLM_API_KEY: ${MEMOBASE_LLM_API_KEY:?Set MEMOBASE_LLM_API_KEY}
      MEMOBASE_EMBEDDING_API_KEY: ${MEMOBASE_EMBEDDING_API_KEY:?Set MEMOBASE_EMBEDDING_API_KEY}
      API_HOSTS: ${API_HOSTS:?Set API_HOSTS}
      USE_CORS: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./api/config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      redis:
        condition: service_healthy
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks: [backend, ingress, data]

  maintenance:
    <<: *memoia-runtime
    command: ["/app/.venv/bin/python", "-m", "memoia_server.maintenance_worker"]
    environment:
      <<: *memoia-environment
      MAINTENANCE_CONCURRENCY: "2"
    ports: []
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "memoia_server.maintenance_worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  backend:
    internal: true
  ingress:
  data:
    external: true
    name: jianify-data
