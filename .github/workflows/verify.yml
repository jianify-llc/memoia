name: Memoia · Verify

on:
  workflow_call:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - name: Run the same isolated checks as local Test pushes
        run: python3 scripts/verify_local.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pytest-results-3.12
          path: .local-ci-results/**
