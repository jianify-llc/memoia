name: Memoia · Verify

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the candidate AMD64 image without publication
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src/server/api
          platforms: linux/amd64
          load: true
          push: false
          tags: memoia-verification:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=verify-amd64
          cache-to: type=gha,scope=verify-amd64,mode=min
      - name: Check the built image identity and import
        run: |
          set -euo pipefail
          image="memoia-verification:$GITHUB_SHA"
          docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}' | grep -Fx 'linux/amd64'
          docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | grep -Fx "$GITHUB_SHA"
          docker run --rm --network none --entrypoint /app/.venv/bin/python "$image" -c 'import memoia_server; print(memoia_server.__version__)'
          printf 'Built source %s for linux/amd64; package import checked. No publication or business tests.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
