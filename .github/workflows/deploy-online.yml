name: Memoia · Online
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      manifest_sha256: ${{ steps.identity.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require stable tag at current release HEAD
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git ls-remote origin refs/heads/release | cut -f1)" = "$GITHUB_SHA"
          git fetch --no-tags origin "$GITHUB_REF"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.12.4 --activate
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - run: pnpm install --frozen-lockfile
        working-directory: src/worker
      - run: pnpm install --frozen-lockfile
        working-directory: sdks/typescript
      - run: pnpm build
        working-directory: sdks/typescript
      - run: pnpm install --frozen-lockfile
        working-directory: src/mcp
      - name: Verify candidate
        env:
          MEMOIA_TEST_PG_TOOLS: /usr/lib/postgresql/17/bin
        run: src/worker/node_modules/.bin/tsx scripts/verify.ts full
      - name: Build immutable Worker artifact
        id: identity
        run: |
          set -euo pipefail
          src/worker/node_modules/.bin/tsx deploy/artifact.ts build online "$GITHUB_SHA" "$RUNNER_TEMP/memoia-candidate"
          echo "manifest_sha256=$(sha256sum "$RUNNER_TEMP/memoia-candidate/manifest.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memoia-online-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/memoia-candidate/
          if-no-files-found: error
  deploy:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: online
    concurrency:
      group: memoia-online-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.12.4 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: src/worker
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: memoia-online-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/memoia-candidate
      - name: Recheck release and tag after approval
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release | cut -f1)" = "$GITHUB_SHA"
          git fetch --no-tags origin "$GITHUB_REF"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
      - name: Deploy approved Worker artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MANIFEST_SHA256: ${{ needs.candidate.outputs.manifest_sha256 }}
        run: src/worker/node_modules/.bin/tsx deploy/release.ts deploy online "$RUNNER_TEMP/memoia-candidate" "$MANIFEST_SHA256" "$GITHUB_SHA"
