name: Memoia · Online

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require version tag at current Release HEAD
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable vMAJOR.MINOR.PATCH tag' >&2; exit 1; }
          release_sha=$(git ls-remote origin refs/heads/release | cut -f1)
          [[ -n "$release_sha" && "$GITHUB_SHA" == "$release_sha" ]] || {
            echo "Tag SHA $GITHUB_SHA is not the current release HEAD $release_sha" >&2; exit 1;
          }

  build-platforms:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    concurrency:
      group: memoia-online-image-${{ github.ref_name }}-${{ matrix.arch }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an immutable published version if it exists
        id: existing
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${REGISTRY}/${IMAGE_NAME}:$GITHUB_REF_NAME"
          if docker buildx imagetools inspect "$version" --raw > "$RUNNER_TEMP/version.json" 2> "$RUNNER_TEMP/registry-error"; then
            digest=$(jq -er --arg arch "$ARCH" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("Missing or duplicate platform") end' "$RUNNER_TEMP/version.json")
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            grep -Fx "ERROR: $version: not found" "$RUNNER_TEMP/registry-error" >/dev/null || { cat "$RUNNER_TEMP/registry-error" >&2; exit 1; }
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build this architecture once on its native runner
        id: build
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src/server/api
          platforms: linux/${{ matrix.arch }}
          push: true
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=online-${{ matrix.arch }}
          cache-to: type=gha,scope=online-${{ matrix.arch }},mode=min
          provenance: mode=max
      - name: Validate the native artifact and anonymous pull
        env:
          ARCH: ${{ matrix.arch }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          platform_image="${REGISTRY}/${IMAGE_NAME}@$digest"
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "$anonymous_config"' EXIT
          DOCKER_CONFIG="$anonymous_config" docker pull --platform "linux/$ARCH" "$platform_image"
          docker image inspect "$platform_image" --format '{{.Os}}/{{.Architecture}}' | grep -Fx "linux/$ARCH"
          docker image inspect "$platform_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | grep -Fx "$GITHUB_SHA"

          docker run --rm --platform "linux/$ARCH" --entrypoint /app/.venv/bin/python "$platform_image" -c 'import memoia_server; print(memoia_server.__version__)'
          schema=$(bash deploy/schema-fingerprint.sh "$platform_image")
          mkdir -p "$RUNNER_TEMP/platforms"
          jq -n --arg arch "$ARCH" --arg digest "$digest" --arg sha "$GITHUB_SHA" --arg schema "$schema" '{arch:$arch,digest:$digest,source_commit:$sha,schema:$schema}' > "$RUNNER_TEMP/platforms/$ARCH.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memoia-online-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/platforms/*.json
          overwrite: true

  build-online:
    needs: build-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: memoia-online-manifest-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: memoia-online-*-${{ github.run_id }}
          path: ${{ runner.temp }}/platforms
          merge-multiple: true
      - name: Assemble or verify the same validated artifacts
        id: identity
        run: |
          set -euo pipefail
          version="${REGISTRY}/${IMAGE_NAME}:$GITHUB_REF_NAME"
          directory="$RUNNER_TEMP/platforms"
          [[ "$(find "$directory" -type f | wc -l)" -eq 2 ]]
          inputs=()
          for arch in amd64 arm64; do
            file="$directory/$arch.json"
            jq -e --arg arch "$arch" --arg sha "$GITHUB_SHA" '.arch == $arch and .source_commit == $sha and (.digest | test("^sha256:[0-9a-f]{64}$"))' "$file" >/dev/null
            inputs+=("${REGISTRY}/${IMAGE_NAME}@$(jq -r .digest "$file")")
          done
          jq -e '.schema | test("^[0-9a-f]{64}$")' "$directory/amd64.json" "$directory/arm64.json" >/dev/null
          [[ "$(jq -r .schema "$directory/amd64.json")" == "$(jq -r .schema "$directory/arm64.json")" ]] || { echo 'Architecture schema sources differ' >&2; exit 1; }
          if ! docker buildx imagetools inspect "$version" >/dev/null 2> "$RUNNER_TEMP/registry-error"; then
            grep -Fx "ERROR: $version: not found" "$RUNNER_TEMP/registry-error" >/dev/null || { cat "$RUNNER_TEMP/registry-error" >&2; exit 1; }
            docker buildx imagetools create --tag "$version" "${inputs[@]}"
          fi
          digest=$(docker buildx imagetools inspect "$version" --format '{{json .Manifest}}' | jq -er .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}@$digest" --raw > "$RUNNER_TEMP/manifest.json"
          for arch in amd64 arm64; do
            actual=$(jq -er --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("Missing or duplicate platform") end' "$RUNNER_TEMP/manifest.json")
            expected=$(jq -r .digest "$directory/$arch.json")
            # 原生构建的输出也可能是包含 provenance 的平台索引。
            platform="${REGISTRY}/${IMAGE_NAME}@$expected"
            if [[ "$actual" != "$expected" ]]; then
              docker buildx imagetools inspect "$platform" --raw > "$RUNNER_TEMP/platform.json"
              expected=$(jq -er --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest] | if length == 1 then .[0] else error("Missing or duplicate built platform") end' "$RUNNER_TEMP/platform.json")
            fi
            [[ "$actual" == "$expected" ]] || { echo 'Published manifest differs from validated artifact' >&2; exit 1; }
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Online artifact: source=%s image=%s@%s platforms=linux/amd64,linux/arm64\n' "$GITHUB_SHA" "${REGISTRY}/${IMAGE_NAME}" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy-online:
    needs: build-online
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: memoia-online-deployment
      cancel-in-progress: false
    environment:
      name: online
      url: https://memoia.jianify.dev
      deployment: false
    permissions:
      contents: read
      deployments: write
    env:
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      ONLINE_BEARER_TOKEN: ${{ secrets.MEMOIA_ONLINE_BEARER_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      MANIFEST_DIGEST: ${{ needs.build-online.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy the approved digest over direct SSH
        run: |
          set -euo pipefail
          for name in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_HOST DEPLOY_PORT DEPLOY_USER ONLINE_BEARER_TOKEN MANIFEST_DIGEST; do
            [[ -n "${!name:-}" ]] || { echo "Missing online Environment value: $name" >&2; exit 1; }
          done
          [[ "$DEPLOY_USER" == github ]] || { echo 'Online SSH user must be github' >&2; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$DEPLOY_PORT < 1 || 10#$DEPLOY_PORT > 65535 )); then
            echo 'Invalid Online SSH port' >&2; exit 1;
          fi
          [[ "$MANIFEST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(git ls-remote origin refs/heads/release | cut -f1)" == "$GITHUB_SHA" ]] || {
            echo 'A newer Release commit exists; refusing stale deployment' >&2; exit 1;
          }
          image="${REGISTRY}/${IMAGE_NAME}@${MANIFEST_DIGEST}"
          key=$(mktemp "$RUNNER_TEMP/memoia-online-key.XXXXXX")
          hosts=''
          trap 'rm -f -- "$key"; if [[ -n "$hosts" ]]; then rm -f -- "$hosts"; fi' EXIT
          hosts=$(mktemp "$RUNNER_TEMP/memoia-online-known-hosts.XXXXXX")
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          chmod 600 "$key" "$hosts"
          ssh_opts=(-F /dev/null -i "$key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          root=/opt/memoia
          compose_sha=$(sha256sum deploy/docker-compose.yml | cut -d' ' -f1)
          # shellcheck disable=SC2029 # Validated candidate identity expands on the runner.
          ssh "${ssh_opts[@]}" "$target" "sudo -n test -d '$root' && sudo -n install -d -m 700 '$root/.deploy' '$root/.deploy/candidates' '$root/.deploy/candidates/$GITHUB_SHA'"
          # shellcheck disable=SC2029
          tar -C deploy -cf - deploy-memoia.sh infra-fingerprint.sh schema-fingerprint.sh recovery.py schema-maintenance.py | ssh "${ssh_opts[@]}" "$target" "sudo -n tar -C '$root/.deploy/candidates/$GITHUB_SHA' -xf -"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" "sudo -n bash '$root/.deploy/candidates/$GITHUB_SHA/deploy-memoia.sh' prepare '$root' '$image' '$GITHUB_SHA' '$GITHUB_RUN_ID' '$compose_sha'"
          bash deploy/smoke-api.sh https://memoia.jianify.dev "$ONLINE_BEARER_TOKEN"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$target" "sudo -n bash '$root/.deploy/candidates/$GITHUB_SHA/deploy-memoia.sh' finalize '$root' '$image' '$GITHUB_SHA' '$GITHUB_RUN_ID' '$compose_sha'"
      - name: Record successful Online deployment
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${MANIFEST_DIGEST}"
          payload=$(jq -nc --arg ref "$GITHUB_SHA" --arg image "$image" --arg config "$GITHUB_SHA" '{ref:$ref,environment:"online",auto_merge:false,required_contexts:[],payload:{image:$image,config_commit:$config}}')
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --method POST --input - --jq .id <<< "$payload")
          status=$(jq -nc '{state:"success",environment_url:"https://memoia.jianify.dev",description:"Basic acceptance: API health, auth and user CRUD passed"}')
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --method POST --input - <<< "$status" >/dev/null
          printf 'Online basic acceptance: source=%s image=%s. Full memory acceptance remains separate.\n' "$GITHUB_SHA" "$image" >> "$GITHUB_STEP_SUMMARY"
