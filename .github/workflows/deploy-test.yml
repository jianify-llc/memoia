name: Memoia · Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ vars.MEMOIA_TEST_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    concurrency:
      group: memoia-test-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require current test SHA
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/test
          test "$(git ls-remote origin refs/heads/test | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.12.4 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: src/worker
      - name: Check current test SHA again before publication
        run: test "$(git ls-remote origin refs/heads/test | cut -f1)" = "$GITHUB_SHA"
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: src/worker/node_modules/.bin/tsx deploy/release.ts deploy test
